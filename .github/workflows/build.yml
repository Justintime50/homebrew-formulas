name: build

on: [push, pull_request]

jobs:
  tap:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
      - run: brew tap justintime50/formulas
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        # Needed since we untap `justintime50/formulas`, the post job step will fail
        continue-on-error: true
      - run: |
          brew untap justintime50/formulas || true
          brew tap local/formulas $(pwd)
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            brew install "local/formulas/$name"
          done
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
      - run: brew audit --tap justintime50/formulas
